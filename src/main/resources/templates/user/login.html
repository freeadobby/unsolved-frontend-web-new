<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}"
      layout:fragment="Content"
>

<div>
    <div class="container mb-lg-3" style="display:flex;
        justify-content: center;
        align-items : center">
        <div class="card" style="width:600px; height:550px">
            <div class="container p-5" style="width:550px;
            height:500px;
            background-color:white">
                <p class="fw-bold" style="font-size:30px">unSolved.ac</p>
                <p style="font-size:25px">로그인</p>
                <div class="container py-4" style="height:300px">
                    <form th:action="@{/user/login}" th:object="${loginForm}" method="post">
                        <div class="form-floating w-75" style="margin:auto">
                            <input type="email" class="form-control" id="email"
                                   placeholder="name@example.com" th:field="*{email}">
                            <label for="email">아이디/이메일</label>
                        </div>
                        <div class="form-floating w-75" style="margin:auto">
                            <input type="password" class="form-control" id="password"
                                   placeholder="Password" th:field="*{password}">
                            <label for="password">패스워드</label>
                        </div>
                        <div class="container py-5">
                            <p style="color:#5599ce; display:inline">비밀번호 찾기</p>
                            <button class="btn btn-primary w-25 fw-bold" type="submit" style="float:right">로그인</button>
                        </div>
                    </form>
                    <a href="/register" class="btn btn-info w-100 py-2 fw-bold" role="button" style="background-color:white; border:3px solid #5599ce; text-emphasis-color:#5599ce; font-size:20px; color:#5599ce">회원가입</a>
                </div>
            </div>
        </div>
    </div>
</div>

</html>

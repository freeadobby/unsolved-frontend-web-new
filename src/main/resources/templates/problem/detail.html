<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}"
      layout:fragment="Content"
      xmlns="http://www.w3.org/1999/html">

<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="row">
    <div class="col"></div>
    <div class="col-8">
        <div class="row align-items-end" style="margin-left: 20px; margin-right: 20px; margin-bottom: 2%;">
            <div class="col-10"><h4>[[${problemContent.title}]] #[[${problemId}]]</h4></div>
            <div class="col-2">
                <div class="row justify-content-end">
                    <th:block th:if="${#strings.isEmpty(userName)}">
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#staticBackdrop" style="width: 50%;" disabled>문제분석</button>
                    </th:block>
                    <th:block th:unless="${#strings.isEmpty(userName)}">
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#staticBackdrop" style="width: 50%;">문제분석</button>
                    </th:block>

                </div>
            </div>
        </div>
        <div>
            <div class="col-md-12" style="margin-bottom: 3%;">
                <div class="table-responsive">
                    <table class="table" id="problem-info">
                        <thead>
                        <tr>
                            <th style="width:16%;">시간 제한</th>
                            <th style="width:16%;">메모리 제한</th>
                            <th style="width:17%;">제출</th>
                            <th style="width:17%;">정답</th>
                            <th style="width:17%;">맞힌 사람</th>
                            <th style="width:17%;">정답 비율</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td th:text="${problemContent.time}"></td>
                            <td th:text="${problemContent.memory}"></td>
                            <td th:text="${problemContent.submit}"></td>
                            <td th:text="${problemContent.correct}"></td>
                            <td th:text="${problemContent.accepted}"></td>
                            <td th:text="${problemContent.correctRate}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div id="problem-body" class="">
                <div class="col-md-12" style="margin-bottom: 3%;">
                    <section id="description" class="problem-section">
                        <div class="headline">
                            <h2>문제</h2>
                        </div>
                        <div id="problem_description" class="problem-text">
                            <th:block th:text="${problemContent.content}"></th:block>
                        </div>
                    </section>
                </div>
                <div class="col-md-12" style="margin-bottom: 3%;">
                    <section id="input" class="problem-section">
                        <div class="headline">
                            <h2>입력</h2>
                        </div>
                        <div id="problem_input" class="problem-text">
                            <th:block th:text="${problemContent.input}"></th:block>
                        </div>
                    </section>
                </div>

                <div class="col-md-12" style="margin-bottom: 3%;">
                    <section id="output" class="problem-section">
                        <div class="headline">
                            <h2>출력</h2>
                        </div>
                        <div id="problem_output" class="problem-text">
                            <th:block th:text="${problemContent.output}"></th:block>
                        </div>
                    </section>
                </div>
                <div class="col-md-12">
                    <section id="limit" style="display:none;" class="problem-section">
                        <div class="headline">
                            <h2>제한</h2>
                        </div>
                        <div id="problem_limit" class="problem-text">
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>
    <div class="col"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticBackdropLabel">
                    [[${problemContent.title}]]
                    <small class="text-body-secondary">#[[${problemId}]]</small>
                </h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col"><canvas id="analysis" width="400px" height="400px"></canvas></div>
                    <div class="col">
                        <div class="container w-75"><canvas id="score" width="400px" height="400px"></canvas></div>
                        <div style="height: 150px;">
                            <h5 style="margin-top: 40px;">종합 분석</h5>
                            <h6 th:text="${analysis.opinion}"></h6>
                        </div>
                    </div>
                </div>
                <div class="container mt-4">
                    <a th:each="tag:${analysis.problem.tags}" href="#" class="btn btn-light btn-sm">[[${tag.name}]]</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Chart Data -->
<script>
    const analysisCtx = document.getElementById('analysis').getContext('2d');
    const analysisChart = new Chart(analysisCtx, {
        type: 'bar',
        data: {
            labels: ['My', 'Problem', 'Analysis'],
            datasets: [{
                data: [ [[${analysis.scoreUser}]] , [[${analysis.scoreProblem}]] , [[${analysis.scoreAnalysis}]] ],
                backgroundColor: [
                    'rgba(255, 99, 132, 0.2)',
                    'rgba(54, 162, 235, 0.2)',
                    'rgba(255, 206, 86, 0.2)'
                ],
                borderColor: [
                    'rgba(255, 99, 132, 1)',
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 206, 86, 1)',
                ],
                borderWidth: 1
            }]
        },
        options: {
            indexAxis: 'y',
            elements: {
                bar: {
                    borderWidth: 2,
                }
            },
            responsive: true,
            plugins: {
                legend: {
                    display: false,
                    position: 'right',
                },
                title: {
                    display: true,
                    text: 'Analysis'
                }
            }
        },
    });
</script>

<script>
    let score = [[${analysis.totalScore}]];

    var chartData = [0, 0, 0];
    if (score < 0) {
        chartData[0] = -score;
        chartData[1] = 100 - chartData[0];
    } else if (score > 0) {
        chartData[2] = score;
        chartData[1] = 100 - chartData[2];
    } else chartData[1] = 100;

    const scoreCtx = document.getElementById('score').getContext('2d');
    const scoreChart = new Chart(scoreCtx, {
        type: 'doughnut',
        data: {
            datasets: [{
                label: '평균점수',
                data: chartData,
                backgroundColor: [
                    'rgba(54, 162, 235, 0.2)',
                    'rgba(255, 206, 86, 0.2)',
                    'rgba(255, 99, 132, 0.2)'
                ],
                borderColor: [
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 206, 86, 1)',
                    'rgba(255, 99, 132, 1)'
                ],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                },
                title: {
                    display: true,
                    text: 'Score'
                }
            }
        },
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
